publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.7.1
  esc_pos_utils_plus: ^2.0.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
