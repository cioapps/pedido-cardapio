# Cloudflare Pages - cardápio online + painel
# Deploy: npm run deploy  (ou conecte o repositório no painel da Cloudflare)
name = "cardapio-online"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Variáveis usadas pela Pages Function (functions/[slug].ts).
# Configure no painel: Settings > Variables and Secrets
#   SUPABASE_URL      = https://SEU-PROJETO.supabase.co
#   SUPABASE_ANON_KEY = chave pública
# E para o build do Vite: VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY
